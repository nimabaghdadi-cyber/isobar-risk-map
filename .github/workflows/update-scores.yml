name: Update ISOBAR scores

# Runs automatically every 6 hours, and can also be triggered manually
# from the "Actions" tab in GitHub with the "Run workflow" button.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the update script
        run: python update_scores.py

      - name: Commit updated scores
        run: |
          git config user.name "isobar-bot"
          git config user.email "isobar-bot@users.noreply.github.com"
          git add data/scores.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update scores"
          git push
